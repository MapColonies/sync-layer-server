services:
  postgis:
    image: postgis/postgis:15-3.4-alpine
    container_name: sync-layer-server-test-db
    ports:
      - '55432:5432'
    environment:
      POSTGRES_DB: sync_layer_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ['CMD-SHELL', 'psql -U postgres -d sync_layer_test -c "SELECT 1" >/dev/null 2>&1']
      interval: 1s
      timeout: 5s
      retries: 60
      start_period: 15s
